<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculaNota - Series y Operaciones Parciales</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 720px;
        }

        .app-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
        }

        .app-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px;
            gap: 6px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .view-container {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .view-container.active {
            display: flex;
        }

        /* Vista Calculadora Vertical con Suboperaciones */
        .vertical-calc-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .vertical-textarea {
            width: 100%;
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            color: var(--text-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .vertical-textarea:focus {
            border-color: var(--primary);
        }

        .result-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-clear {
            background-color: #334155;
            color: var(--text-main);
        }

        .btn-calc {
            background-color: var(--primary);
            color: white;
        }

        .btn-save {
            background-color: var(--accent);
            color: white;
            grid-column: span 2;
        }

        /* Vista Notas Registradas */
        .notes-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-card {
            background: #273548;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .note-total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .note-body {
            font-size: 0.9rem;
            color: var(--text-main);
            white-space: pre-wrap;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .note-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 8px;
        }

        .empty-notes {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>CalculaNota</h1>
        </div>

        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calc')">Series y Operaciones</button>
            <button class="tab-btn" onclick="switchTab('notes')" id="notes-tab-btn">Notas (0)</button>
        </div>

        <!-- Vista Calculadora de Series con Suboperaciones -->
        <div id="calc-view" class="view-container active">
            <div class="vertical-calc-content">
                <div class="input-group">
                    <label for="series-input">Escribe conceptos y operaciones (ej: 3 adornos * 46):</label>
                    <textarea id="series-input" class="vertical-textarea" placeholder="Ejemplo:&#10;3 adornos * 46 c/u&#10;2*4 tapas&#10;50 cemento" oninput="calcularSerie()"></textarea>
                </div>

                <div class="result-box">
                    <span class="result-label">Suma Total:</span>
                    <span class="result-value" id="result-display">0</span>
                </div>

                <div class="actions-grid">
                    <button class="btn btn-clear" onclick="limpiarCampos()">Borrar</button>
                    <button class="btn btn-calc" onclick="calcularSerie()">Calcular</button>
                    <button class="btn btn-save" onclick="guardarNotaSerie()">Guardar en Notas</button>
                </div>
            </div>
        </div>

        <!-- Vista Notas -->
        <div id="notes-view" class="view-container">
            <div class="notes-content" id="notes-list">
                <div class="empty-notes">No hay notas guardadas aún.</div>
            </div>
        </div>
    </div>

    <script>
        let notes = [];

        function switchTab(tab) {
            const calcView = document.getElementById('calc-view');
            const notesView = document.getElementById('notes-view');
            const tabBtns = document.querySelectorAll('.tab-btn');

            if (tab === 'calc') {
                calcView.classList.add('active');
                notesView.classList.remove('active');
                tabBtns[0].classList.add('active');
                tabBtns[1].classList.remove('active');
            } else {
                notesView.classList.add('active');
                calcView.classList.remove('active');
                tabBtns[1].classList.add('active');
                tabBtns[0].classList.remove('active');
                renderNotes();
            }
        }

        function calcularSerie() {
            const texto = document.getElementById('series-input').value;
            const lineas = texto.split('\n');
            let sumaTotal = 0;

            lineas.forEach(linea => {
                if (!linea.trim()) return;

                // Intentamos extraer operaciones matemáticas simples por línea (ej: números separados por *, /, +, -)
                // Limpiamos letras de palabras comunes o texto sobrante dejando solo números y operadores permitidos: [0-9, ., +, -, *, /]
                // O evaluamos de manera inteligente buscando patrones numéricos con operadores.
                try {
                    // Extraer todos los fragmentos matemáticos o evaluar la línea si contiene símbolos de operación
                    // Buscamos si la línea contiene algún operador matemático (*, /, +, -)
                    let evaluado = evaluarLineaMatematica(linea);
                    sumaTotal += evaluado;
                } catch (e) {
                    // Si falla, intentamos sumar solo los números sueltos encontrados
                    const matches = linea.match(/-?\d+(\.\d+)?/g);
                    if (matches) {
                        matches.forEach(num => sumaTotal += parseFloat(num) || 0);
                    }
                }
            });

            document.getElementById('result-display').innerText = Number.isInteger(sumaTotal) ? sumaTotal : sumaTotal.toFixed(2);
            return sumaTotal;
        }

        function evaluarLineaMatematica(linea) {
            // Filtramos la línea para extraer únicamente números y operadores válidos
            // Reemplazamos caracteres no deseados o letras para aislar la operación
            // Por ejemplo: "3 adornos * 46 c/u" -> "3 * 46"
            
            // Buscamos secuencias del tipo: numero op numero (ej: 3 * 46, 2*4, etc.)
            // O extraemos todos los bloques numéricos y operadores entre ellos en esa línea
            
            // Una forma robusta: extraer números y operadores aritméticos en orden de aparición en la línea
            let tokens = linea.match(/-?\d+(\.\d+)?|[+\-*/]/g);
            if (!tokens || tokens.length === 0) return 0;

            // Si hay un solo número sin operador, devolvemos ese número
            if (tokens.length === 1) {
                return parseFloat(tokens[0]) || 0;
            }

            // Si hay varios tokens (ej: ['3', '*', '46']), construimos una expresión aritmética segura para evaluar
            // Validamos que los tokens alternen o tengan sentido matemático básico
            let expresionLimpia = tokens.join(' ');
            
            // Evaluamos de forma segura con Function en lugar de eval directo por buenas prácticas
            try {
                let resultadoParcial = Function('"use strict"; return (' + expresionLimpia + ')')();
                return typeof resultadoParcial === 'number' && !isNaN(resultadoParcial) ? resultadoParcial : 0;
            } catch (err) {
                // Si la expresión compuesta falla, sumamos los números encontrados individualmente en la línea
                let sumaParcialFallback = 0;
                tokens.forEach(t => {
                    let num = parseFloat(t);
                    if (!isNaN(num)) sumaParcialFallback += num;
                });
                return sumaParcialFallback;
            }
        }

        function limpiarCampos() {
            document.getElementById('series-input').value = '';
            calcularSerie();
        }

        function guardarNotaSerie() {
            const contenido = document.getElementById('series-input').value.trim();
            if (!contenido) {
                alert('La serie está vacía. Escribe al menos un valor u operación.');
                return;
            }

            const total = calcularSerie();
            const now = new Date();
            
            const fechaFormateada = now.toLocaleDateString('es-ES', {
                day: '2-digit', month: 'short', year: 'numeric'
            }) + ', ' + now.toLocaleTimeString('es-ES', {
                hour: '2-digit', minute: '2-digit'
            });

            const nuevaNota = {
                id: Date.now(),
                contenido: contenido,
                total: Number.isInteger(total) ? total : total.toFixed(2),
                fecha: fechaFormateada
            };

            notes.unshift(nuevaNota);
            document.getElementById('notes-tab-btn').innerText = `Notas (${notes.length})`;
            
            limpiarCampos();
            switchTab('notes');
        }

        function eliminarNota(id) {
            notes = notes.filter(n => n.id !== id);
            document.getElementById('notes-tab-btn').innerText = `Notas (${notes.length})`;
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notes-list');
            if (notes.length === 0) {
                container.innerHTML = '<div class="empty-notes">No hay notas guardadas aún.</div>';
                return;
            }

            container.innerHTML = notes.map(note => `
                <div class="note-card">
                    <div class="note-header">
                        <span>📅 ${note.fecha}</span>
                        <span class="note-total">Suma: ${note.total}</span>
                    </div>
                    <div class="note-body">${escapeHtml(note.contenido)}</div>
                    <div class="note-footer">
                        <button class="delete-btn" onclick="eliminarNota(${note.id})">Eliminar Nota</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
